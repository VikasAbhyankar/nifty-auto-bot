name: 7 Agents NSE Optimum
on:
  schedule:
    - cron: '45 9 * * 1-5'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install yfinance pandas numpy pytz requests

      - name: Check files
        run: ls -l

      - name: Check secrets exist (no values shown)
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then echo "ERROR: TELEGRAM_BOT_TOKEN is MISSING"; else echo "OK: TELEGRAM_BOT_TOKEN exists"; fi
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then echo "ERROR: TELEGRAM_CHAT_ID is MISSING"; else echo "OK: TELEGRAM_CHAT_ID exists"; fi
          if [ -z "${{ secrets.BOT_TOKEN }}" ]; then echo "INFO: BOT_TOKEN not set - using TELEGRAM_BOT_TOKEN"; else echo "OK: BOT_TOKEN exists"; fi

      - name: Run 7 Agents
        run: python india_engine_7_agents.py
        env:
          TELEGRAM_FNO_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FNO_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          CAPITAL: ${{ secrets.CAPITAL }}
