name: Nifty500 Neural Boss

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  stocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas numpy requests python-telegram-bot
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nifty500_main.py
      - name: Save memory
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add *.json || true
          git commit -m "stocks update [skip ci]" || true
          git push || true
