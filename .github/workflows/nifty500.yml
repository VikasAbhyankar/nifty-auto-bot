name: Nifty500 Morning Report

on:
  repository_dispatch:
    types: [nifty500-trigger]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5'  # Backup: 8:30 AM IST

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: pip install -r requirements.txt
        
      - name: Run Nifty500 Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nifty500.py
