name: Nifty500 Top3 Neural

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests --quiet

      - name: Run Nifty500 Neural Boss V2
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python nifty500_neural_boss_v2.py

      - name: Save memory
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add v4_memory.json || true
          git commit -m "memory save" || true
          git push || true
