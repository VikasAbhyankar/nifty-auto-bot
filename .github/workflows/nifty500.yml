name: Nifty500 Neural Boss

on:
  schedule:
    - cron: '0 3 * * 1-5'   # 8:30 AM IST Mon-Fri
    - cron: '30 3 * * 1-5'  # 9:00 AM IST
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: pip install requests numpy
      
      - name: Run V10 Swing Killer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nifty500_neural_boss_v2.py
      
      - name: Save Logs
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add *.json *.log || true
          git commit -m "v10 scan [skip ci]" || true
          git push || true
