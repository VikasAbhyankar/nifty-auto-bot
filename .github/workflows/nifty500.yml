name: Nifty500 Neural Boss
on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - run: python nifty500_neural_boss_v2.py
