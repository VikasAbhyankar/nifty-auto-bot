name: nifty500
permissions:
  contents: write

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 AM IST Mon-Fri
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install yfinance pandas requests --quiet

      - name: Run python nifty500 screener
        run: |
          python nifty500_screener.py

      - name: Commit CSV files
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Trading Bot"
          git pull --rebase || true
          git add paper_trades.csv nifty500_results.csv sniper_avwp_results.csv *.csv || true
          git commit -m "Update trades - $(date +'%d-%b %H:%M IST')" || echo "No changes to commit"
          git push || echo "Push failed - check Settings > Actions > Read/Write permission"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_number }}
          path: |
            *.csv
          if-no-files-found: warn
