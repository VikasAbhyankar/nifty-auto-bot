name: Nifty500 Top3 Neural

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install deps
        run: pip install requests yfinance pandas numpy
      
      - name: Run Nifty500 Top3
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nifty500_neural_boss_v2.py
      
      - name: Save Memory
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Nifty Bot"
          git add nifty_memory.json || true
          git commit -m "Update memory V4.0" || true
          git push || true
