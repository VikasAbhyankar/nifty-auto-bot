name: V8 Elite Self-Learning

on:
  schedule:
    # Every 10 mins from 9 AM to 3:30 PM IST (3:30-10:00 UTC) Mon-Fri
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  v8:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests python-telegram-bot

      - name: Run V8 Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python v8_main.py

      - name: Save Learning Experience
        run: |
          git config user.name "v8-bot"
          git config user.email "v8-bot@github.com"
          git add v8_experience.json || true
          git add nifty_memory.json || true
          git diff --staged --quiet || git commit -m "V8 learning update [skip ci]"
          git push || echo "No changes to push"
