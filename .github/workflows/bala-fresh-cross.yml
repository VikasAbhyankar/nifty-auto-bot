name: BALA V1.6
run-name: BALA ${{ inputs.mode }} - Run ${{ github.run_number }}
on:
  schedule:
    - cron: '50 3 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '15 4 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '45 4 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'pre', 'full', 'quick']
      send_telegram:
        description: 'Telegram pe msg bheju?'
        required: false
        default: false
        type: boolean
jobs:
  run:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance requests pytz
      - name: Run BALA V1.6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SEND_TELEGRAM: ${{ github.event_name == 'schedule' && 'true' || inputs.send_telegram }}
        run: python bala_fresh_cross.py --mode auto
