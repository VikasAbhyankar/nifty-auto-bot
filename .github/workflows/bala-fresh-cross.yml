name: BALA V1.5
run-name: BALA ${{ inputs.mode }} - Run ${{ github.run_number }}
on:
  schedule:
    - cron: '50 3 * * 1-5'  # 9:20 IST PRE
    - cron: '0 4 * * 1-5'   # 9:30 IST FULL
    - cron: '15 4 * * 1-5'  # 9:45 IST QUICK
    - cron: '30 4 * * 1-5'  # 10:00 IST QUICK
    - cron: '45 4 * * 1-5'  # 10:15 IST QUICK
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'pre', 'full', 'quick']
jobs:
  run:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run BALA V1.5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python bala_fresh_cross.py --mode auto
