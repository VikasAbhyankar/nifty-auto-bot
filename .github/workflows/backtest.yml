name: Run Backtest V4.0

on:
  workflow_dispatch:  # This creates the BUTTON

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install yfinance pandas requests

      - name: Run Backtest 247 Days
        run: |
          python backtest_daytrading.py
          
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_results.csv
            nifty_memory.json
