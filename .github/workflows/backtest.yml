name: Backtest Adaptive

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install deps
        run: |
          pip install requests numpy
          
      - name: Run Backtest
        run: |
          python backtest_adaptive.py
