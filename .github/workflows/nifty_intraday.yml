name: Nifty Intraday LLM V7.0

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'  # Every 5 min 9 AM to 3:30 PM IST (3:30-10 UTC)
  workflow_dispatch:

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run Intraday LLM Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Optional - if you add, real LLM used
        run: python nifty_intraday_llm_bot.py
      - name: Save Tick & Memory
        run: |
          git config user.name "intraday-bot"
          git config user.email "bot@intraday.com"
          git add intraday_memory.json intraday_risk.json nifty_ticks_today.csv nifty_memory.json || true
          git commit -m "tick $(date +%H:%M)" || true
          git push || true
