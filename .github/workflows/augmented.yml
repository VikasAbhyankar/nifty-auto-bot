name: MASTER BOT 500 V8.5 - 2 MSG

on:
  schedule:
    - cron: '0 4 * * 1-5'   # 9:30 AM IST - Entry
    - cron: '15 10 * * 1-5' # 3:45 PM IST - Final
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install yfinance pandas requests
      - name: Run Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          CAPITAL: ${{ secrets.CAPITAL }}
        run: python augmented_ai_screener.py
