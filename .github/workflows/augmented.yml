name: True Bala V20 Multi-Agent
on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 AM IST = MARKET_DIR
    - cron: '15 4 * * 1-5'   # 9:45 AM IST = DAY_SWING
    - cron: '30 9 * * 1-5'   # 3:00 PM IST = BTST
    - cron: '30 10 * * 1-5'  # 4:00 PM IST = PRO
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan Type'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - MARKET_DIR
          - DAY_SWING
          - BTST
          - PRO
permissions:
  contents: read
jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q yfinance pandas numpy requests
      - name: Run V20
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_TYPE: ${{ inputs.scan_type || 'AUTO' }}
        run: python augmented_ai_screener.py
