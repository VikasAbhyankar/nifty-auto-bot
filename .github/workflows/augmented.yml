name: MASTER V20.1 - Upstox Live - IST
on:
  schedule:
    - cron: '30 3 * * 1-5'
    - cron: '15 4 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check Files
        run: ls -R
      - name: Install deps
        run: pip install --quiet yfinance pandas numpy requests pytz
      - name: Run V20.1 - IST + Upstox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          UPSTOX_TOKEN_EXPIRY: ${{ secrets.UPSTOX_TOKEN_EXPIRY }}
        run: python augmented_ai_screener.py
