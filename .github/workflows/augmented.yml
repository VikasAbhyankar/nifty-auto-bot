name: True Bala Screener V19.2
on:
  schedule:
    - cron: '15 4 * * 1-5'   # 9:45 AM IST = Market Direction
    - cron: '30 9 * * 1-5'   # 3:00 PM IST = BTST
    - cron: '30 10 * * 1-5'  # 4:00 PM IST = Pro Market
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan Type'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - MARKET_DIR
          - BTST
          - PRO
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_TYPE: ${{ inputs.scan_type }}
        run: python augmented_ai_screener.py
