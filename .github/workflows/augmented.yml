name: Augmented AI Brain
on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
jobs:
  run-ai-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy requests
      - name: Run Augmented AI Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TOKEN: ${{ secrets.TOKEN }}
        run: python augmented_ai_screener.py
      - run: |
          git config --global user.name "AI-Brain-Bot"
          git config --global user.email "bot@ai.com"
          git add ai_memory.csv || true
          git commit -m "AI Memory Update" || true
          git push || true
