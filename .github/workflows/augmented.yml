name: MASTER V20.1 - Upstox Live - IST
on:
  schedule:
    - cron: '25 4 * * 1-5'   # 9:55 AM IST ONLY - Do not add more crons
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install --quiet yfinance pandas numpy requests pytz
      - name: Run V20.1 - 9:55 AM ONLY
        run: python augmented_ai_screener.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          UPSTOX_TOKEN_EXPIRY: ${{ secrets.UPSTOX_TOKEN_EXPIRY }}
