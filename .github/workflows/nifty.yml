name: Nifty Pivot Boss 6.0 Self-Learning

on:
  schedule:
    - cron: '45 3 * * 1-5'  # 9:15 AM IST Mon-Fri
  workflow_dispatch:

jobs:
  run-nifty-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Nifty Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python nifty_bot.py

      - name: Save Memory & CSV
        run: |
          git config user.name "nifty-bot"
          git config user.email "bot@nifty.com"
          git add nifty_memory.json nifty_oct25_oct26.csv || true
          git commit -m "🧠 memory update $(date)" || echo "No changes"
          git push || echo "Push failed"
