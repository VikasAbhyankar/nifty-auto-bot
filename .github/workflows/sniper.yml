name: Sniper AVWP Screener

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1-5'  # Auto runs at 8:45 AM IST Mon-Fri (3:15 UTC)

jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install yfinance pandas numpy requests

      - name: Run Sniper AVWP Screener
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python sniper_avwp_screener.py
          
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: sniper-avwp-results
          path: sniper_avwp_results.csv
