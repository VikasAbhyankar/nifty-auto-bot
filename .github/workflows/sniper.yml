name: Sniper AVWP Screener - 15 Min

on:
  schedule:
    # 9:15 AM to 3:30 PM IST = 3:45 AM to 10:00 AM UTC, every 15 mins, Mon-Fri
    - cron: '45,0,15,30,45 3-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install yfinance pandas requests pytz
      - name: Run V11
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SNIPER_BOT_TOKEN: ${{ secrets.SNIPER_BOT_TOKEN }}
          SNIPER_CHAT_ID: ${{ secrets.SNIPER_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python sniper_avwp_screener.py
