name: Sniper AVWP Screener - 15 Min

on:
  schedule:
    # Run every 15 mins - GitHub will show as "scheduled" not "manual"
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run Sniper V10 Auto
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SNIPER_BOT_TOKEN: ${{ secrets.SNIPER_BOT_TOKEN }}
          SNIPER_CHAT_ID: ${{ secrets.SNIPER_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC Time: $(date -u)"
          echo "IST Time: $(TZ='Asia/Kolkata' date)"
          python sniper_avwp_screener.py

      - name: Save state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sniper_avwp_results.csv last_sniper.json || true
          git commit -m "auto $(TZ='Asia/Kolkata' date +'%H:%M IST')" || true
          git push || true
