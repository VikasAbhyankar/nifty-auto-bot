name: sniper
permissions:
  contents: write
on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance pandas requests pytz

      - name: Run python sniper_avwp_screener.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SNIPER_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SNIPER_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python sniper_avwp_screener.py

      - name: Commit CSV files
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Trading Bot"
          git pull --rebase || true
          git add paper_trades.csv sniper_avwp_results.csv || true
          git commit -m "Update trades - $(date +'%d-%b %H:%M IST')" || echo "No changes"
          git push || echo "Push failed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trading-results
          path: |
            paper_trades.csv
            sniper_avwp_results.csv
