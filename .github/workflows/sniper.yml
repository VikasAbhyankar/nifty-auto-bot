name: Sniper AVWP Screener - 15 Min

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests pytz

      - name: Run Sniper V10
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SNIPER_BOT_TOKEN: ${{ secrets.SNIPER_BOT_TOKEN }}
          SNIPER_CHAT_ID: ${{ secrets.SNIPER_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python sniper_avwp_screener.py

      - name: Save results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sniper_avwp_results.csv last_sniper.json || echo "No files to add"
          git commit -m "auto update $(TZ='Asia/Kolkata' date +'%d-%b %H:%M IST')" || echo "No changes"
          git push || echo "Push failed - no changes"
