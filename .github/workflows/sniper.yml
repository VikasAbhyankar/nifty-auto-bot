name: Sniper AVWP Screener - 15 Min
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas requests pytz
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SNIPER_BOT_TOKEN: ${{ secrets.SNIPER_BOT_TOKEN }}
          SNIPER_CHAT_ID: ${{ secrets.SNIPER_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python sniper_avwp_screener.py
